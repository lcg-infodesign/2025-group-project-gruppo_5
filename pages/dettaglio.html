<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Istoplot 3D piatto • Incidenti / Lesionati</title>

  <!-- p5.js (modalità globale) -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.2/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.2/lib/addons/p5.dom.min.js"></script>

  <link rel="stylesheet" href="../dettaglio.css" />
</head>
<body>
  <header class="top">
    <h1 class="title">Responsabilità del conducente</h1>
    <p class="subtitle">Responsabilità di cause esterne</p>
    <p class="subtitle">Responsabilità di non conducenti</p>

    <!-- i pulsanti sono stati spostati all'interno della legenda (vedi sotto) -->
  </header>

  <!-- 2 colonne: grafico (a sinistra) + legenda (a destra) -->
  <main id="stage">
    <section id="plot-area">
      <div id="canvas-holder"></div>
      <div id="tip" hidden></div>
    </section>

    <aside id="legend">
      <div class="buttons">
        <button id="btnInc" class="btn active">Incidenti</button>
        <button id="btnLes" class="btn">Lesionati</button>
      </div>

        <p class="legend-sub" id="legend-sub">AREA = numero di incidenti</p>

      <h2 id="legend-title">incidenti</h2>

        <div id="legend-canvas-holder"></div>
        <p id="legend-mortality-note" class="legend-sub" hidden>La percentuale mostra la mortalità per tipologia: Percentuale = 100 × Morti / Incidenti.</p>
    </aside>
  </main>

  <script src="../javascript/dettaglio.js"></script>
</body>
</html>
